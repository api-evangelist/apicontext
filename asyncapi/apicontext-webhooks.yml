  - delete-call-webhook-v2
  - list-hooks
  - create-hook
  - get-hook
  - update-hook
  - delete-hook
  - list-notifications
  - list-notifications-by-call
  - get-notification
  - update-notification
  discovery_note: >-
    GET /api/2/webhooks/types and GET /api/2/webhooks/types/{type} are a machine-readable registry of
    the supported webhook destinations and the properties each one requires — the closest thing the
    platform has to a published event schema, and it is fetchable by an authenticated agent.
event_types:
- {id: pass, description: "An API call met its pass conditions (by default HTTP 200)."}
- {id: warning, description: "An API call triggered a warning (by default a 4xx client-side result)."}
