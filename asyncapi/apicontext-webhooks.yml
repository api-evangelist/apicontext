note: >-
  APIContext publishes no AsyncAPI document. It does ship a real, first-class OUTBOUND event surface:
  the platform pushes alert and result events to nineteen named destinations, and the REST contract
  carries 27 operations for managing those subscriptions. This artifact captures that webhook catalog;
  no AsyncAPI is fabricated for it.
direction: outbound
delivery: provider-to-subscriber HTTP push (plus OTLP export and email)
subscription_management:
  v3_operations: [list-webhooks, create-webhook, get-webhook, update-webhook, delete-webhook]
  v2_operations:
  - list-webhook-types-v2
  - get-webhook-type-properties-v2
  - list-webhooks-v2
  - create-webhook-v2
  - get-webhook-v2
  - update-webhook-v2
  - delete-webhook-v2
