  on that endpoint returns JSON-RPC -32001 ''Authorization required'', and no anonymous OAuth protected-resource
  document is served, so the real tool names and inputSchemas could not be read. No tool is invented,
  and no OpenAPI operation is mapped to a guessed tool name. The MCP endpoint is a documentation server
  on the docs host, so there is no reason to expect it to project the platform''s REST operations at all.
  rest_only[] below is therefore the whole REST surface, grouped by capability, and is the honest statement
  of what an agent cannot reach through MCP today.'
