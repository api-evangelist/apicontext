  /api/2/manage/copy:
    post:
      tags:
      - Manage
      summary: Copy-Resources
      description: "Clone resources from the active project into another project.\n\nCascades behaviour\
        \ (see ``manage.copy_call`` etc.):\n    * Calls: copies the underlying ServiceConfig + emits warnings\
        \ that\n      tokens and files are NOT cloned. Copies PostTestConditions and\n      non-``apimetrics_*``\
        \ webhooks.\n    * Workflows: also clones every referenced Call.\n    * Auths / Reports: cloned\
        \ in isolation.\n\nSet ``dry_run=true`` to preview without writing."
      operationId: copy-resources
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyMoveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyMoveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/2/manage/move:
    post:
      tags:
      - Manage
      summary: Move-Resources
      description: "Re-parent resources from the active project to another project.\n\nGuards (return\
        \ 400 outside of dry-run, accumulate into ``errors[]``\nin dry-run):\n    * Calls / workflows\
        \ referenced by a Schedule cannot be moved.\n    * Calls with a ``file_key`` cannot be moved.\n\
        \    * Moving an auth shared by a not-being-moved call is blocked.\n    * Moving where ``destination\
        \ == source`` is rejected with 400.\n\nCross-org moves emit two Cloud Tasks to re-home ClickHouse\
        \ + Insights\ndata for each call. See ``move_api_call`` and ``move_insights`` on\n``TasksClient``."
      operationId: move-resources
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyMoveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyMoveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
