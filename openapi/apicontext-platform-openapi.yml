    CopyMoveRequest:
      properties:
        id:
          items:
            type: string
          type: array
          title: Id
          description: One or more resource keys to copy or move. May be sent as a JSON array or a single
            string; a string is normalised to a list of one.
        type:
          type: string
          enum:
          - call
          - workflow
          - auth
          - report
          - browser
          - mcp
          title: Type
          description: 'Kind of resource. One of: call, workflow, auth, report.'
        destination:
          type: string
          title: Destination
          description: Urlsafe key of the destination project.
        dry_run:
          type: boolean
          title: Dry Run
          description: If true, collect what *would* happen into errors/warnings/info without writing.
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - destination
      title: CopyMoveRequest
      description: Body shape for both ``/api/2/manage/copy`` and ``/api/2/manage/move``.
      examples:
      - destination: ahFkZXZ-YXBpbWV0cmljcy1xY3ILCxIEVXNlchieQgw
        dry_run: true
        id:
        - ahFkZXZ-YXBpbWV0cmljcy1xY3IOCxIHVGVzdFNldHVwGL9CDA
        type: call
    CopyMoveResponse:
      properties:
        source:
          type: string
          title: Source
        destination:
          type: string
          title: Destination
        type:
          type: string
          enum:
          - call
          - workflow
          - auth
          - report
          - browser
          - mcp
          title: Type
        info:
          items:
            type: string
          type: array
          title: Info
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        errors:
          items:
            type: string
          type: array
          title: Errors
      type: object
      required:
      - source
      - destination
      - type
      title: CopyMoveResponse
      description: "Response shape for both endpoints.\n\nField semantics match the Py2 handler:\n\n*\
        \ ``info``    -- success messages, one per cloned/moved entity.\n* ``warnings`` -- non-blocking\
        \ advisories (e.g. tokens not copied).\n* ``errors``  -- blocking failures collected in ``dry_run``\
        \ mode;\n                 non-dry-run runs raise 400 on the first one of these."
      examples:
      - destination: ahFkZXZ-YXBpbWV0cmljcy1xY3ILCxIEVXNlchifQgw
        errors: []
        info:
        - Will copy API Call "Login"
        source: ahFkZXZ-YXBpbWV0cmljcy1xY3ILCxIEVXNlchieQgw
        type: call
        warnings: []
