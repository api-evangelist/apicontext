      in: query
      description: Pagination cursor returned by a previous list response
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of results (1–100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    attributes:
