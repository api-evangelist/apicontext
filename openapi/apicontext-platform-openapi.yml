    KeyStr:
      type: string
      description: URL-safe base64 Datastore key
      minLength: 3
      maxLength: 400
      pattern: ^[-A-Za-z0-9_]*={0,3}$
    NullableKeyStr:
      type: string
      minLength: 3
      maxLength: 400
      pattern: ^[-A-Za-z0-9_]*={0,3}$
      nullable: true
    KeyValuePair:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ParameterList:
      oneOf:
      - type: array
        items:
          $ref: '#/components/schemas/KeyValuePair'
      - type: object
        additionalProperties:
          type: string
    CallMeta:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 400
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        description:
          type: string
          maxLength: 1500
          nullable: true
        workspace:
          type: string
          maxLength: 100
        project_id:
          $ref: '#/components/schemas/KeyStr'
        domain:
          type: string
          format: hostname
        username:
          type: string
        created:
          type: string
          format: date-time
          readOnly: true
        last_update:
          type: string
          format: date-time
          readOnly: true
    CallRequest:
      type: object
      required:
      - url
      - method
      properties:
        method:
          type: string
          enum:
          - GET
          - HEAD
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
          - get
          - head
          - post
          - put
          - delete
          - patch
          - options
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: object
            required:
            - scheme
            - hostname
            properties:
              scheme:
                type: string
                enum:
                - http
                - https
              hostname:
                type: string
                format: hostname
              port:
                type: integer
                minimum: 1
                maximum: 65535
                nullable: true
              path:
                type: string
        parameters:
          $ref: '#/components/schemas/ParameterList'
        headers:
          $ref: '#/components/schemas/ParameterList'
        body:
          type: string
          nullable: true
        auth_id:
          $ref: '#/components/schemas/NullableKeyStr'
        token_id:
          $ref: '#/components/schemas/NullableKeyStr'
        file_id:
          $ref: '#/components/schemas/NullableKeyStr'
    CallInput:
      type: object
      required:
      - meta
      - request
      properties:
        meta:
          $ref: '#/components/schemas/CallMeta'
        request:
          $ref: '#/components/schemas/CallRequest'
    CallOutput:
      allOf:
      - $ref: '#/components/schemas/CallInput'
      - type: object
        required:
        - id
        properties:
          id:
            $ref: '#/components/schemas/KeyStr'
    CallRunInput:
      type: object
      properties:
        location_id:
          type: string
        run_delay:
          type: integer
          minimum: 0
          maximum: 86400
        context:
          type: object
          additionalProperties: true
    CallRunOutput:
      type: object
      properties:
        call_id:
          $ref: '#/components/schemas/KeyStr'
        result_id:
