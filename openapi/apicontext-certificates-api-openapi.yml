openapi: 3.2.0
info:
  title: APImetrics Certificates API
  description: API for the APImetrics platform
  termsOfService: http://apimetrics.io/tos/
  contact:
    name: APIContext Support
    url: https://apicontext.io/
    email: support@apicontext.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v2026-09-02
tags:
- name: Certificates
paths:
  /api/3/organizations/{org_id}/certificates/:
    get:
      tags:
      - Certificates
      summary: List-Certificates
      description: List metadata for all of an org's Certificates.
      operationId: list-certificates
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]{3,400}$
          title: Organization ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResults'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Certificates
      summary: Create-Certificate
      description: Create a new Certificate.
      operationId: create-certificate
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]{3,400}$
          title: Organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api3__certificates__api_models__CreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateMetadata'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/3/organizations/{org_id}/certificates/{certificate_id}:
    get:
      tags:
      - Certificates
      summary: Read-Certificate
      description: Read an existing Certificate.
      operationId: read-certificate
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: certificate_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          title: Resource ID
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]{3,400}$
          title: Organization ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateMetadata'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Certificates
      summary: Update-Certificate
      description: Update an existing Certificate.
      operationId: update-certificate
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: certificate_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          title: Resource ID
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]{3,400}$
          title: Organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api3__certificates__api_models__UpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateMetadata'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Certificates
      summary: Delete-Certificate
      description: Delete an existing Certificate.
      operationId: delete-certificate
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: certificate_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          title: Resource ID
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]{3,400}$
          title: Organization ID
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CertificateMetadata:
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          title: Resource ID
        created:
          type: string
          format: date-time
          title: Created
        last_update:
          type: string
          format: date-time
          title: Last Update
        name:
          type: string
          title: Name
        intended_use:
          $ref: '#/components/schemas/IntendedUse'
        not_after:
          type: string
          format: date-time
          title: Not After
        not_before:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Not Before
        subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
        issuer:
          anyOf:
          - type: string
          - type: 'null'
          title: Issuer
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
        kid:
          anyOf:
          - type: string
          - type: 'null'
          title: Kid
        kid_alg:
          $ref: '#/components/schemas/KidAlg'
          default: manual
        projects:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Projects
      type: object
      required:
      - id
      - created
      - last_update
      - name
      - intended_use
      - not_after
      - not_before
      - subject
      - issuer
      - serial_number
      - version
      - kid
      - projects
      title: CertificateMetadata
      description: Certificate metadata for responses which don't need the actual values.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    api3__certificates__api_models__CreateRequest:
      properties:
        name:
          type: string
          title: Name
        intended_use:
          $ref: '#/components/schemas/IntendedUse'
        certificate:
          type: string
          title: Certificate
        private_key:
          type: string
          title: Private Key
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
        kid:
          anyOf:
          - type: string
          - type: 'null'
          title: Kid
        kid_alg:
          anyOf:
          - $ref: '#/components/schemas/KidAlg'
          - type: 'null'
        projects:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Projects
      type: object
      required:
      - name
      - intended_use
      - certificate
      - private_key
      title: CreateRequest
    KidAlg:
      type: string
      enum:
      - manual
      - rfc7638-sha1
      - rfc7638-sha256
      title: KidAlg
    CertificateListResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/CertificateMetadata'
          type: array
          title: Results
        meta:
          $ref: '#/components/schemas/CertificateListMeta'
      type: object
      required:
      - results
      - meta
      title: CertificateListResults
    CertificateListMeta:
      properties:
        org_id:
          type: string
          pattern: ^[a-z0-9]{3,400}$
          title: Organization ID
      type: object
      required:
      - org_id
      title: CertificateListMeta
    IntendedUse:
      type: string
      enum:
      - mtls
      - signing
      - signing-pss
      title: IntendedUse
    api3__certificates__api_models__UpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        intended_use:
          anyOf:
          - $ref: '#/components/schemas/IntendedUse'
          - type: 'null'
        certificate:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificate
        private_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Private Key
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
        kid:
          anyOf:
          - type: string
          - type: 'null'
          title: Kid
        kid_alg:
          anyOf:
          - $ref: '#/components/schemas/KidAlg'
          - type: 'null'
        projects:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Projects
      type: object
      title: UpdateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            openid: OpenID Connect identity
            profile: User profile
            email: User email address
          authorizationUrl: https://auth.apimetrics.io/authorize?audience=https://client.apimetrics.io
          tokenUrl: https://auth.apimetrics.io/oauth/token
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
