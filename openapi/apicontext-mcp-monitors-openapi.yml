          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Timeout Ms
          description: Step timeout (milliseconds)
        wait_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Wait Ms
          description: Time to wait after finishing step (milliseconds)
        step_type:
          type: string
          const: list_resources
