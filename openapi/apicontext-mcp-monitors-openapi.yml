components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            openid: OpenID Connect identity
            profile: User profile
            email: User email address
          authorizationUrl: https://auth.apimetrics.io/authorize?audience=https://client.apimetrics.io
          tokenUrl: https://auth.apimetrics.io/oauth/token
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    McpCallToolStepRepr:
      properties:
        timeout_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Timeout Ms
          description: Step timeout (milliseconds)
        wait_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Wait Ms
          description: Time to wait after finishing step (milliseconds)
        step_type:
          type: string
          const: call_tool
          title: Step Type
          default: call_tool
        tool_name:
          type: string
          title: Tool Name
          description: Name of the tool to call
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
          description: Arguments to provide for the tool call
      additionalProperties: false
      type: object
      required:
      - timeout_ms
      - wait_ms
      - tool_name
      title: McpCallToolStepRepr
    McpGetPromptStepRepr:
      properties:
        timeout_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Timeout Ms
          description: Step timeout (milliseconds)
        wait_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Wait Ms
          description: Time to wait after finishing step (milliseconds)
        step_type:
          type: string
          const: get_prompt
          title: Step Type
          default: get_prompt
        prompt_name:
          type: string
          title: Prompt Name
          description: Name of the prompt to get
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
          description: Arguments to provide to the prompt template
      additionalProperties: false
      type: object
      required:
      - timeout_ms
      - wait_ms
      - prompt_name
      title: McpGetPromptStepRepr
    McpListPromptsStepRepr:
      properties:
        timeout_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Timeout Ms
          description: Step timeout (milliseconds)
        wait_ms:
          type: integer
          maximum: 120000.0
          minimum: 0.0
          title: Wait Ms
          description: Time to wait after finishing step (milliseconds)
        step_type:
          type: string
          const: list_prompts
          title: Step Type
          default: list_prompts
      additionalProperties: false
      type: object
      required:
      - timeout_ms
      - wait_ms
      title: McpListPromptsStepRepr
    McpListResourceTemplatesStepRepr:
