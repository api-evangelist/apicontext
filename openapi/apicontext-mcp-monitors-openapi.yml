servers:
- url: https://client.apimetrics.io
  description: APIContext (APImetrics) platform API
tags:
- name: MCP Monitors
  description: '

    Manage MCP Monitors.


    MCP Monitors test MCP servers by running a configurable sequence of steps (e.g. listing tools, calling
    a tool) against a

    target HTTP(S) URL.

    '
paths:
  /api/3/monitors/mcp/:
    get:
      tags:
      - MCP Monitors
      summary: List all MCP Monitors for a project
      operationId: list-mcp-monitors
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTestSetupListResults'
              examples:
                list:
                  summary: A project's MCP monitors
                  value:
                    results:
                    - id: ahJzfmFwaW1ldHJpY3MtcHJvZHIWCxILTWNwVGVzdFNldHVwGICAgICA
                      meta:
                        monitor_type: mcp
                        name: Check tools endpoint
                        tags: []
                        domain: mcp.example.com
                        created: '2025-01-15T10:00:00Z'
                        last_update: '2025-01-15T10:00:00Z'
                        owner: ahJzfmFwaW1ldHJpY3MtcHJvZHILCxIEVXNlchhiAgI
                        workspace: global
                      setup:
                        url: https://mcp.example.com/sse
                        overall_timeout_ms: 30000
                        steps:
                        - timeout_ms: 10000
                          wait_ms: 0
                          step_type: list_tools
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - MCP Monitors
      summary: Create a new MCP Monitor
      operationId: create-mcp-monitor
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api3__monitors__mcp__api_models__CreateRequest'
            examples:
              list_tools:
                summary: Monitor that lists available tools
                value:
                  name: Check tools endpoint
                  tags: []
                  workspace: global
                  url: https://mcp.example.com/sse
                  overall_timeout_ms: 30000
                  steps:
                  - timeout_ms: 10000
                    wait_ms: 0
                    step_type: list_tools
              call_tool:
                summary: Monitor that calls a specific tool
                value:
                  name: Echo health check
                  tags: []
                  workspace: global
                  url: https://mcp.example.com/sse
                  overall_timeout_ms: 60000
                  steps:
                  - timeout_ms: 10000
                    wait_ms: 0
                    step_type: list_tools
                  - timeout_ms: 15000
                    wait_ms: 0
                    step_type: call_tool
                    tool_name: echo
                    parameters:
                      message: ping
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTestSetupRepr'
              examples:
                list_tools:
                  summary: Monitor that lists available MCP tools
                  value:
                    id: ahJzfmFwaW1ldHJpY3MtcHJvZHIWCxILTWNwVGVzdFNldHVwGICAgICA
                    meta:
                      monitor_type: mcp
                      name: Check tools endpoint
                      tags: []
                      domain: mcp.example.com
                      created: '2025-01-15T10:00:00Z'
                      last_update: '2025-01-15T10:00:00Z'
                      owner: ahJzfmFwaW1ldHJpY3MtcHJvZHILCxIEVXNlchhiAgI
                      workspace: global
                    setup:
                      url: https://mcp.example.com/sse
                      overall_timeout_ms: 30000
                      steps:
                      - timeout_ms: 10000
                        wait_ms: 0
                        step_type: list_tools
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
