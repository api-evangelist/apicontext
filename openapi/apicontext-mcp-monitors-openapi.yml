                    step_type: list_tools
                  - timeout_ms: 15000
                    wait_ms: 0
                    step_type: call_tool
                    tool_name: echo
                    parameters:
                      message: ping
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTestSetupRepr'
              examples:
                list_tools:
                  summary: Monitor that lists available MCP tools
                  value:
                    id: ahJzfmFwaW1ldHJpY3MtcHJvZHIWCxILTWNwVGVzdFNldHVwGICAgICA
                    meta:
                      monitor_type: mcp
                      name: Check tools endpoint
                      tags: []
                      domain: mcp.example.com
                      created: '2025-01-15T10:00:00Z'
                      last_update: '2025-01-15T10:00:00Z'
                      owner: ahJzfmFwaW1ldHJpY3MtcHJvZHILCxIEVXNlchhiAgI
                      workspace: global
                    setup:
                      url: https://mcp.example.com/sse
                      overall_timeout_ms: 30000
                      steps:
                      - timeout_ms: 10000
                        wait_ms: 0
                        step_type: list_tools
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - MCP Monitors
      summary: Patch an existing MCP Monitor
      operationId: patch-mcp-monitor
      security:
      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          title: MCP Monitor ID
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api3__monitors__mcp__api_models__UpdateRequest'
            examples:
              rename:
                summary: Rename the monitor
                value:
                  name: Updated monitor name
              replace_steps:
                summary: Replace steps with a tool call sequence
                value:
                  steps:
                  - timeout_ms: 10000
                    wait_ms: 0
                  - timeout_ms: 15000
                    wait_ms: 0
                    tool_name: echo
                    parameters:
                      message: ping
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpTestSetupRepr'
              examples:
                list_tools:
                  summary: Monitor that lists available MCP tools
                  value:
