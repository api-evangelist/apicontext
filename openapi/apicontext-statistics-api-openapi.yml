        required: false
        schema:
          $ref: '#/components/schemas/StatsMetric'
          description: Latency metric to aggregate.
          default: total_time
        description: Latency metric to aggregate.
      - name: location_id
        in: query
        required: false
        schema:
          type: string
          description: Agent location id to filter to, or `__ALL__` for all locations.
          examples:
          - __ALL__
          default: __ALL__
          title: Location Id
        description: Agent location id to filter to, or `__ALL__` for all locations.
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Maximum number of rows to return (default 1000 aggregated, 5000 for RAW).
          examples:
          - 1000
          title: Limit
        description: Maximum number of rows to return (default 1000 aggregated, 5000 for RAW).
      - name: time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Point in time selecting the period to report (ISO 8601, UTC assumed if no offset).
            Defaults to now.
          examples:
          - '2024-01-01T12:00:00Z'
          title: Time
        description: Point in time selecting the period to report (ISO 8601, UTC assumed if no offset).
          Defaults to now.
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Start of the reporting window (ISO 8601). Clamped to the call's creation time.
          examples:
          - '2024-01-01T00:00:00Z'
          title: Start
        description: Start of the reporting window (ISO 8601). Clamped to the call's creation time.
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: End of the reporting window (ISO 8601). Clamped to now.
          examples:
          - '2024-01-02T00:00:00Z'
          title: End
        description: End of the reporting window (ISO 8601). Clamped to now.
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
