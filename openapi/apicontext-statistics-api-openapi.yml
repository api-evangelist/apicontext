          type: number
          maximum: 100
          minimum: 0
          description: Percentile to compute (0–100).
          default: 50.0
          title: Quantile
        description: Percentile to compute (0–100).
      - name: metric
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StatsMetric'
          description: Latency metric to aggregate.
          default: total_time_no_dns
        description: Latency metric to aggregate.
      - name: metric[]
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/StatsMetric'
          - type: 'null'
          description: Repeatable; one output column per metric. Overrides `metric`.
          title: Metric[]
        description: Repeatable; one output column per metric. Overrides `metric`.
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StatsCategory'
          - type: 'null'
          description: Restrict the quantile to a single result category.
          title: Category
        description: Restrict the quantile to a single result category.
      - name: dest_ip
        in: query
        required: false
        schema:
          type: string
          description: Group results by destination IP as well as domain/location when truthy (`1`/`t`/`true`).
          examples:
          - t
          default: t
          title: Dest Ip
        description: Group results by destination IP as well as domain/location when truthy (`1`/`t`/`true`).
      - name: time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Point in time selecting the period to report (ISO 8601, UTC assumed if no offset).
            Defaults to now.
          examples:
          - '2024-01-01T12:00:00Z'
          title: Time
        description: Point in time selecting the period to report (ISO 8601, UTC assumed if no offset).
          Defaults to now.
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Start of the reporting window (ISO 8601). Clamped to the call's creation time.
          examples:
          - '2024-01-01T00:00:00Z'
          title: Start
        description: Start of the reporting window (ISO 8601). Clamped to the call's creation time.
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: End of the reporting window (ISO 8601). Clamped to now.
          examples:
          - '2024-01-02T00:00:00Z'
          title: End
        description: End of the reporting window (ISO 8601). Clamped to now.
      - name: apimetrics-project-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Apimetrics-Project-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            openid: OpenID Connect identity
            profile: User profile
            email: User email address
          authorizationUrl: https://auth.apimetrics.io/authorize?audience=https://client.apimetrics.io
          tokenUrl: https://auth.apimetrics.io/oauth/token
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    BreakdownKind:
      type: string
      enum:
      - HOUR
      - DAY
      - WEEK
      - MONTH
      title: BreakdownKind
      description: '``http_codes`` / ``legacy/passfail*`` — no YEAR.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HttpBreakdownResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_HttpBreakdownMeta'
        stat:
          $ref: '#/components/schemas/_HttpBreakdownStat'
      type: object
      required:
      - meta
      - stat
      title: HttpBreakdownResponse
    LegacyPassFailRangeResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_LegacyPassFailMeta'
        results:
          additionalProperties:
            $ref: '#/components/schemas/_PassFailCounts'
          type: object
          title: Results
      type: object
      required:
      - meta
      - results
      title: LegacyPassFailRangeResponse
    LegacyPassFailResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_LegacyPassFailMeta'
        stat:
          $ref: '#/components/schemas/_PassFailCounts'
      type: object
      required:
      - meta
      - stat
      title: LegacyPassFailResponse
    ListStatsKind:
      type: string
      enum:
      - RAW
      - HOUR
      - DAY
      - WEEK
      - MONTH
      - YEAR
      title: ListStatsKind
      description: As ``StatsKind`` plus ``RAW`` (per-result rows) for ``since``/``before``.
    PassFailKind:
      type: string
      enum:
      - HOUR
      - DAY
      - MONTH
      - YEAR
      title: PassFailKind
      description: '``passfail`` / ``passfail_range`` (KIND_CLASS_MAP) — no WEEK.'
    PassFailRangeResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_PassFailRangeMeta'
        results:
          additionalProperties:
            $ref: '#/components/schemas/_PassFailCounts'
          type: object
          title: Results
      type: object
      required:
      - meta
      - results
      title: PassFailRangeResponse
    PassFailResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_PassFailMeta'
        stat:
          $ref: '#/components/schemas/_PassFailCounts'
      type: object
      required:
      - meta
      - stat
      title: PassFailResponse
    PassFailTotalResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_PassFailTotalMeta'
        stat:
          additionalProperties: true
          type: object
          title: Stat
      type: object
      required:
      - meta
      - stat
      title: PassFailTotalResponse
    QuantileResponse:
      properties:
        columns:
          items:
            type: string
          type: array
          title: Columns
        index:
          items:
            items: {}
            type: array
          type: array
          title: Index
        data:
          items:
            items:
              type: number
            type: array
          type: array
          title: Data
      type: object
      required:
      - columns
      - index
      - data
      title: QuantileResponse
      description: pandas-``to_dict('split')``-style payload (columns / index / data).
    StatListResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_StatListMeta'
        stats:
          items:
            $ref: '#/components/schemas/_StatItem'
          type: array
          title: Stats
      type: object
      required:
      - meta
      - stats
      title: StatListResponse
    StatResponse:
      properties:
        meta:
          $ref: '#/components/schemas/_StatMeta'
        stat:
          anyOf:
          - $ref: '#/components/schemas/_StatValues'
          - type: 'null'
        adv_stat:
          anyOf:
          - $ref: '#/components/schemas/_StatValues'
          - type: 'null'
      type: object
      required:
      - meta
      title: StatResponse
    StatsCategory:
      type: string
      enum:
      - PASS
      - SLOW
      - WARNING
      - FAIL
      title: StatsCategory
      description: Result category filter for the quantile ``metrics/`` endpoint.
    StatsKind:
      type: string
      enum:
      - HOUR
      - DAY
      - WEEK
      - MONTH
      - YEAR
      title: StatsKind
      description: Aggregation period for ``stats/`` and ``metrics/`` (StatsApiHandler.VALID_KINDS).
    StatsMetric:
      type: string
      enum:
      - namelookup_time
      - time_to_connect
      - time_to_handshake
      - time_to_tx_request
      - time_to_first_byte
      - time_to_response
      - total_time
      - total_time_no_dns
      - server_time
