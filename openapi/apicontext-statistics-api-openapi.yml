      - CONNECTION_WARNING
      - HTTP_REDIRECT_ERROR
      - HTTP_CLIENT_ERROR
      - CONTENT_WARNING
      - SLA_WARNING
      - HTTP_SERVER_ERROR
      - CONNECTION_ERROR
      - HEADER_ERROR
      - CONTENT_ERROR
      - SLA_ERROR
      - COMPLETE
      - SLOW_COMPLETE
      title: StatsType
    ValidationError:
      properties:
