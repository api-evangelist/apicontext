      - OAuth2: []
      - ApiKey: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          title: API Monitor ID
      - name: kind
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ListStatsKind'
          description: Aggregation period (`RAW` for per-result rows).
          default: DAY
        description: Aggregation period (`RAW` for per-result rows).
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StatsType'
          description: Result-code filter; `ALL` counts every result.
          default: ALL
        description: Result-code filter; `ALL` counts every result.
      - name: metric
