  conforms: true
  evidence: >-
    https://client.apimetrics.io/openapi.json declares openapi 3.1.0 with 217 paths, 325 operations
    and 560 component schemas.
- id: oauth2
  conforms: true
  evidence: >-
    components.securitySchemes.OAuth2 declares an authorizationCode flow against
