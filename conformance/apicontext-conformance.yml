domain_standard:
  claimed: false
  note: >-
    Reward-only check, deliberately left unclaimed. The API-observability market has no adopted wire
    standard that this contract declares. OpenTelemetry is the closest candidate and APIContext does
    export OTLP, but that is an outbound webhook integration, not a shape the platform contract itself
    declares, so no domain-standard conformance is asserted.
compliance_program:
