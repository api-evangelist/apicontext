note: >-
  APIContext's PRODUCT tests other people's APIs for conformance against FAPI 2.0, an OAuth 2.0
  security profile and customer-supplied OpenAPI. That is a capability it sells, not a property of
  its own contract, so it is recorded under product_conformance_profiles below and is deliberately
  NOT asserted as conformance of the APIContext API itself.
standards:
