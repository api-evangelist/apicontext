base_url: https://client.apimetrics.io
authentication:
  styles:
  - {type: apiKey, in: header, name: X-Api-Key}
  - {type: oauth2, flow: authorizationCode, authorization_url: "https://auth.apimetrics.io/authorize?audience=https://client.apimetrics.io", token_url: https://auth.apimetrics.io/oauth/token}
  - {type: oauth2, flow: deviceCode, token_url: https://auth.apimetrics.io/oauth/token, docs: https://docs.apimetrics.io/docs/device-code-authorization-flow}
  - {type: oauth2, flow: clientCredentials, note: "service accounts, used by the CLI in CI; audience https://client.apimetrics.io"}
  bearer_header: "Authorization: Bearer <access_token>"
  identity_provider: Auth0 tenant at auth.apimetrics.io
  token_lifetime: 1 hour (per the CLI README); client_credentials issues no refresh token (RFC 6749 4.4.3)
  note: >-
    Every operation in the published spec declares `security: [{OAuth2: []}, {ApiKey: []}]`, so both
    mechanisms are accepted everywhere. The /api/2 surface historically also accepted a `_token`
    query parameter; the current published contract does not declare it.
versioning:
  scheme: uri-path
  versions_live: [/api/2, /api/3]
  current: /api/3
  spec_version: v2026-09-02
  spec_version_scheme: date
  note: >-
    Both major versions are served from one host and one OpenAPI document — 144 of 217 paths are
    /api/2 and 73 are /api/3. A `Legacy (proxied)` tag marks nine /api/2 operations that are proxied
    onto v3. The document's own info.version is a date (v2026-09-02), so the spec is versioned by
    publication date rather than by API version.
pagination:
  style: cursor
  params: [cursor, limit]
  param_location: query
  coverage: "50 operations take `cursor`, 52 take `limit`"
  note: >-
    Cursor pagination on the /api/3 surface. The CLI paginates automatically and exposes
    `--rsh-no-paginate` to turn it off.
idempotency:
  supported: false
  coverage: none
  header: null
  note: >-
    No idempotency-key header, parameter or schema field appears anywhere in the published OpenAPI
    (searched for `Idempotency`, `idempotency`, `Idempotency-Key`), and the docs describe no replay
    protection. Retries are handled client-side only — the CLI defaults to `--rsh-retry 2` — so a
    retried POST creates a second monitor, schedule or workflow.
dry_run:
  supported: partial
  scope: [copy-resources]
  note: >-
    A `dry_run` flag exists on exactly one operation, POST /api/2/manage/copy (copy-resources, schemas
    CopyMoveRequest / CopyMoveResponse). No other mutating operation offers a rehearsal mode.
reversibility:
  grade: none
  write_surface: true
  note: >-
    Searched every operationId in the published contract for restore / undo / revert / rollback /
    cancel / archive semantics. There is no reversal operation and the docs state no restore window.
    Deletes (delete-call, delete-schedule, delete-workflow, delete-auth-token, delete-browser-monitor,
    delete-mcp-monitor, delete-org-downtime, …) are terminal as far as the published contract goes.
    Scheduled and organization-level Downtimes suspend monitoring and can be deleted again, which
    makes monitoring pauses reversible, but that is a scheduling control rather than an undo for a
    write. NO WINDOW IS ASSERTED HERE because the provider states none.
  reversal_operations: []
  compensating_controls:
  - operation: create-schedule-downtime
    effect: Suspends a schedule's monitoring for a window; deleting the downtime resumes it.
  - operation: copy-resources
    effect: >-
      POST /api/2/manage/copy duplicates resources between projects and supports dry_run, which lets
      a destructive re-organisation be rehearsed before it is committed.
