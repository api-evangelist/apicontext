aid: apicontext
name: APIContext
description: >-
  APIContext (formerly APImetrics) is a synthetic API testing, monitoring and conformance platform.
  It calls the APIs you depend on from cloud locations around the world on a schedule, measures
  latency and availability from the outside in, validates responses against expected schemas and
  security profiles, and enforces SLOs with alerting, dashboards and reports. The platform monitors
  REST APIs, browser journeys and — since 2025 — MCP servers, exports its telemetry over
  OpenTelemetry to nineteen downstream destinations, and publishes an API directory with performance
  data on 300+ top API providers. Its own platform API is a 325-operation OpenAPI 3.1 contract served
  at client.apimetrics.io across two live versions, with an Auth0 OAuth2 tenant, a Go command-line
  client and provider-authored Agent Skills.
