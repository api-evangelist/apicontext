# APIContext integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in apicontext-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: apicontext-datadog
  label: Forward APIContext SLO breaches into Datadog
  partner: datadog
  category: Observability
  use_case: When APIContext detects an SLO breach or regression for a monitored API, push it into Datadog as a custom
    event and tagged metric so SRE dashboards and alerting policies treat synthetic signal as first-class telemetry
    alongside in-process metrics.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-splunk
  label: Stream APIContext results into Splunk
  partner: splunk
  category: Observability
  use_case: Forward raw APIContext synthetic test results (latency, status codes, validation outcomes) into Splunk
    via HEC so SREs can correlate API-level signal with logs and incidents in their existing Splunk dashboards.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-pagerduty
  label: Page on-call from APIContext SLO breaches
  partner: pagerduty
  category: Incident response
  use_case: When APIContext detects an SLO breach or sustained availability drop for a critical API, fire a PagerDuty
    incident so the right on-call engineer is paged with the offending endpoint, region, and recent error pattern.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-servicenow
  label: Open ServiceNow incidents from APIContext alerts
  partner: servicenow
  category: Incident response
  use_case: When APIContext fires an alert against a monitored API, open a ServiceNow incident with the failure
    details, agent location, and last good run so ITSM workflows and SLAs are driven by real API behavior, not user
    reports.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-slack
  label: Post APIContext alerts to Slack
  partner: slack
  category: Collaboration
  use_case: When APIContext fires an alert (latency regression, SLO breach, conformance failure) post a formatted
    message to the right Slack channel so the API team sees the issue in real time alongside the offending endpoint
    and recent stats.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-microsoft-teams
  label: Notify Microsoft Teams of APIContext SLO status
  partner: microsoft-teams
  category: Collaboration
  use_case: When APIContext SLO status changes (breach, recovery, warning) post an adaptive card to the right Microsoft
    Teams channel so the API and platform teams have a shared timeline of API health inside the tool they already
    live in.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-github-actions
  label: Run APIContext checks from GitHub Actions
  partner: github-actions
  category: CI/CD
  use_case: On pull request or pre-deploy, trigger the relevant APIContext API calls and workflows against the staging
    environment so a synthetic contract-and-performance check gates the deploy. Status flows back via Actions check
    runs.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-postman
  label: Promote Postman collections into APIContext monitors
  partner: postman
  category: API tooling
  use_case: When a Postman collection is updated for a critical API, mirror the relevant requests into APIContext
    as monitored API calls so what is tested in Postman is what is continuously monitored in production from multiple
    regions.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-spectral
  label: Block APIContext monitor creation on Spectral lint failures
  partner: spectral
  category: API tooling
  use_case: Before creating or updating an APIContext monitor for an OpenAPI-described endpoint, run the spec through
    Spectral. If governance rules fail, refuse to create the monitor and surface the violations so APIContext only
    monitors APIs that meet design-time standards.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: apicontext-anthropic
  label: Summarize APIContext incidents with Claude
  partner: anthropic
  category: AI
  use_case: When APIContext fires a critical alert, send the recent insights report and raw results to Claude and
    produce a one-paragraph incident summary, suspected root cause, and recommended next action that can be posted
    into the on-call channel or attached to the incident ticket.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-jira
  label: File Jira issues from APIContext regressions
  partner: jira
  category: Project tracking
  use_case: When APIContext detects a conformance failure or repeating regression on a monitored API, automatically
    file a Jira issue in the owning team's project with the failing endpoint, the diff against last-good behavior,
    and a link back to APIContext insights.
  source: curated
  status: pending-generation
  arazzo: null
- slug: apicontext-opentelemetry
  label: Emit APIContext synthetic spans as OpenTelemetry traces
  partner: opentelemetry
  category: Telemetry
  use_case: Convert APIContext synthetic call executions into OpenTelemetry spans (one root span per call, child
    spans per stage) and ship them to any OTLP-compatible backend so synthetic monitoring data lives next to in-process
    traces in the same trace store.
  source: curated
  status: pending-generation
  arazzo: null
